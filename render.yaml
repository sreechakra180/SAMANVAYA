services:
  # Full-Stack Web Service (FastAPI + Built React Frontend)
  - type: web
    name: samanvaya-app
    runtime: python
    buildCommand: pip install -r requirements.txt && cd app/frontend && npm install && npm run build && cd ../..
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # Static Site Configuration (Client-Side Satark-NLP Intelligence Engine)
  - type: static
    name: samanvaya-static
    buildCommand: cd app/frontend && npm install && npm run build
    staticPublishPath: app/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

